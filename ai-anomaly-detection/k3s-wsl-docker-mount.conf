[Service]
# Docker Desktop WSL integration mounts /Docker/host with an unescaped space in
# /proc/mounts (C:\Program Files\...). kubelet then crashes:
#   Failed to start ContainerManager: wrong number of fields (expected 6, got 7)
# Hide that mount only inside k3s's mount namespace so Docker still works.
ExecStart=
ExecStart=/usr/bin/unshare --mount --propagation private /bin/sh -c "umount /Docker/host >/dev/null 2>&1 || true; exec /usr/local/bin/k3s server"
