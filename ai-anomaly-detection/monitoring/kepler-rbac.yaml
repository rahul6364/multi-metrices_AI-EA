apiVersion: v1
kind: ServiceAccount
metadata:
  name: kepler-sa
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kepler-role
rules:
  - apiGroups: ['']
    resources: ['nodes', 'pods', 'namespaces']
    verbs: ['get', 'list', 'watch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kepler-rolebinding
subjects:
  - kind: ServiceAccount
    name: kepler-sa
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kepler-role
