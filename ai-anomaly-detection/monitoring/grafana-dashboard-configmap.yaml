apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-energy-anomaly
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  energy-anomaly-dashboard.json: |
    {
      "id": null,
      "uid": "energy-anomaly-ieee",
      "title": "AI-Based Energy-Wasting Attack Detection",
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 2,
      "refresh": "5s",
      "time": {"from": "now-15m", "to": "now"},
      "panels": [
        {
          "type": "timeseries",
          "title": "CPU Usage per pod",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [{"refId": "A", "expr": "sum by(pod)(rate(container_cpu_usage_seconds_total{namespace=\"default\",pod!=\"\"}[30s]))"}]
        },
        {
          "type": "timeseries",
          "title": "Memory Usage per pod",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [{"refId": "A", "expr": "sum by(pod)(container_memory_working_set_bytes{namespace=\"default\",pod!=\"\"})"}]
        },
        {
          "type": "timeseries",
          "title": "Energy Consumption per pod",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [
            {"refId": "A", "expr": "sum by(container_name)(rate(kepler_container_joules_total{namespace=\"default\"}[30s]))"},
            {"refId": "B", "expr": "sum by(pod)(rate(container_cpu_usage_seconds_total{namespace=\"default\",pod!=\"\"}[30s])) * 0.4"}
          ]
        },
        {
          "type": "timeseries",
          "title": "Network Traffic per pod (RX+TX)",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [{"refId": "A", "expr": "sum by(pod)(rate(container_network_receive_bytes_total{namespace=\"default\",pod!=\"\"}[30s]) + rate(container_network_transmit_bytes_total{namespace=\"default\",pod!=\"\"}[30s]))"}]
        },
        {
          "type": "gauge",
          "title": "Energy-to-CPU Ratio",
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 16},
          "targets": [{"refId": "A", "expr": "((sum by(pod)(rate(kepler_container_joules_total{namespace=\"default\"}[30s])) or (sum by(pod)(rate(container_cpu_usage_seconds_total{namespace=\"default\",pod!=\"\"}[30s])) * 0.4)))/(sum by(pod)(rate(container_cpu_usage_seconds_total{namespace=\"default\",pod!=\"\"}[30s])) + 0.0001)"}]
        },
        {
          "type": "stat",
          "title": "Node CPU Usage %",
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 16},
          "targets": [{"refId": "A", "expr": "100 * (1 - avg by(instance)(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])))"}],
          "fieldConfig": {"defaults": {"unit": "percent"}}
        },
        {
          "type": "stat",
          "title": "Node Filesystem Usage %",
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 16},
          "targets": [{"refId": "A", "expr": "100 * (1 - (sum(node_filesystem_avail_bytes{fstype!=\"tmpfs\",mountpoint=\"/\"}) / sum(node_filesystem_size_bytes{fstype!=\"tmpfs\",mountpoint=\"/\"})))"}],
          "fieldConfig": {"defaults": {"unit": "percent"}}
        },
        {
          "type": "timeseries",
          "title": "Running Pods by Namespace (kube-state-metrics)",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 24},
          "targets": [{"refId": "A", "expr": "sum by(namespace) (kube_pod_status_phase{phase=\"Running\"})"}]
        },
        {
          "type": "timeseries",
          "title": "Deployments Available Replicas",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 24},
          "targets": [{"refId": "A", "expr": "sum by(namespace, deployment) (kube_deployment_status_replicas_available)"}]
        }
      ]
    }
